<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오재석 포트폴리오</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 2.5rem 2rem;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: #21262d; border: 2px solid #30363d;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 600; color: #58a6ff;
    margin: 0 auto 1.25rem;
  }
  h1 { font-size: 22px; font-weight: 600; color: #e6edf3; margin-bottom: 0.4rem; }
  .subtitle { font-size: 14px; color: #8b949e; margin-bottom: 2rem; }
  .divider { border: none; border-top: 1px solid #21262d; margin: 0 0 1.75rem; }
  .steps-title {
    font-size: 13px; font-weight: 600; color: #8b949e;
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem;
  }
  .steps { list-style: none; text-align: left; margin-bottom: 1.75rem; }
  .steps li {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 0.5rem 0; font-size: 14px; color: #c9d1d9; line-height: 1.5;
  }
  .step-num {
    flex-shrink: 0; width: 22px; height: 22px;
    background: #21262d; border: 1px solid #30363d; border-radius: 50%;
    font-size: 12px; font-weight: 600; color: #58a6ff;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #238636; color: #ffffff; text-decoration: none;
    font-size: 15px; font-weight: 600; padding: 10px 24px;
    border-radius: 8px; margin-bottom: 1.5rem;
  }
  .btn:hover { background: #2ea043; }
  .note { font-size: 12px; color: #6e7681; line-height: 1.6; }
  .note a { color: #58a6ff; text-decoration: none; }
  .note a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="avatar">오</div>
  <h1>오재석 포트폴리오</h1>
  <p class="subtitle">포트폴리오 및 이력서·자기소개서</p>
  <hr class="divider">
  <p class="steps-title">다운로드 방법</p>
  <ul class="steps">
    <li><span class="step-num">1</span><span>아래 초록색 버튼을 클릭합니다</span></li>
    <li><span class="step-num">2</span><span>다운로드가 자동으로 시작됩니다</span></li>
    <li><span class="step-num">3</span><span>저장된 ZIP 파일을 압축 해제하여 확인합니다</span></li>
  </ul>
  <a class="btn" href="https://github.com/Waburu/Portfolio/raw/main/%ED%8F%AC%ED%8A%B8%ED%8F%B4%EB%A6%AC%EC%98%A4%20%EB%B0%8F%20%EC%9D%B4%EB%A0%A5%EC%84%9C_%EC%98%A4%EC%9E%AC%EC%84%9D.zip">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
      <path d="M7.47 10.78a.75.75 0 0 0 1.06 0l3.75-3.75a.75.75 0 0 0-1.06-1.06L8.75 8.44V1.75a.75.75 0 0 0-1.5 0v6.69L4.78 5.97a.75.75 0 0 0-1.06 1.06l3.75 3.75Z"/>
      <path d="M3.75 13a.75.75 0 0 0 0 1.5h8.5a.75.75 0 0 0 0-1.5h-8.5Z"/>
    </svg>
    포트폴리오 및 이력서 다운로드
  </a>
  <p class="note">
    다운로드가 안 될 경우
    <a href="https://github.com/Waburu/Portfolio">GitHub 저장소</a>에서
    직접 파일을 받으실 수 있습니다.
  </p>
</div>
</body>
</html>
